<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Nenúfar</title>
    <meta
      name="description"
      content="Dungeon crawler de ranas con combate por turnos, para navegador y móvil."
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* Solo para lectores de pantalla: no se ve, pero se lee. */
      .solo-lector {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas
      id="juego"
      role="img"
      aria-label="Nenúfar. Se juega con las flechas o WASD, Enter para aceptar, Escape para volver o abrir el inventario e I para ver qué hace cada opción del combate; también tocando la pantalla."
    ></canvas>
    <div id="anuncios" class="solo-lector" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
