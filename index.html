<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Nenúfar</title>
    <meta
      name="description"
      content="Dungeon crawler de ranas con combate por turnos, para navegador y móvil."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Abierto desde el icono de la pantalla de inicio, sin la barra del navegador (en el iPhone, la única forma). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, portafolio...) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nenúfar" />
    <meta
      property="og:description"
      content="Dungeon crawler de ranas con combate por turnos estilo JRPG. Juega en el navegador o el móvil."
    />
    <meta property="og:url" content="https://pedromiras.github.io/nenufar/" />
    <meta property="og:image" content="https://pedromiras.github.io/nenufar/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* El mismo degradado que dibujarFondo: donde no hay mapa 3D, los lados de los menús no quedan negros. */
      body {
        background: linear-gradient(#1a1230, #07050e);
        display: grid;
        place-items: center;
      }
      /* El mapa en 3D (#mundo) va debajo del canvas del juego, que queda para la interfaz. */
      canvas {
        grid-area: 1 / 1;
        image-rendering: pixelated;
      }
      /* Posicionado, para pintarse sobre #mundo: sin esto Safari dejaba el canvas WebGL encima. */
      #juego {
        position: relative;
      }
      /* Ocupa toda la ventana: fuera del canvas 2D se ve el decorado de alrededor de la sala. */
      #mundo {
        position: fixed;
        inset: 0;
        pointer-events: none;
        image-rendering: auto;
      }
      /* Versión nueva publicada: un toque recarga. */
      #actualizacion {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        z-index: 2;
        padding: 10px 16px;
        border: 2px solid #9b7fd6;
        background: #120e20;
        color: #efe9da;
        font: bold 14px monospace;
      }
      #actualizacion[hidden] {
        display: none;
      }
      /* Solo para lectores de pantalla: no se ve, pero se lee. */
      .solo-lector {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas
      id="juego"
      role="img"
      aria-label="Nenúfar. Se juega con las flechas o WASD, Enter para aceptar, Escape o I para abrir el inventario, Escape para volver, e I en combate para ver qué hace cada opción; también tocando la pantalla."
    ></canvas>
    <div id="anuncios" class="solo-lector" aria-live="polite"></div>
    <button id="actualizacion" type="button" hidden>
      Hay una versión nueva · toca para recargar
    </button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
