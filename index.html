<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Nenúfar</title>
    <meta
      name="description"
      content="Dungeon crawler de ranas con combate por turnos, para navegador y móvil."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Vista previa al compartir el enlace (WhatsApp, LinkedIn, portafolio...) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nenúfar" />
    <meta
      property="og:description"
      content="Dungeon crawler de ranas con combate por turnos estilo JRPG. Juega en el navegador o el móvil."
    />
    <meta property="og:url" content="https://pedromiras.github.io/nenufar/" />
    <meta property="og:image" content="https://pedromiras.github.io/nenufar/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        display: grid;
        place-items: center;
      }
      canvas {
        image-rendering: pixelated;
      }
      /* En un móvil en vertical el juego quedaría a un tercio de su tamaño: se pide girarlo. */
      #girar {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1;
        place-content: center;
        gap: 16px;
        padding: 24px;
        background: #10161a;
        color: #e8efe4;
        font: bold 18px monospace;
        text-align: center;
      }
      #girar span {
        font-size: 48px;
        color: #ffd27a;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #girar {
          display: grid;
        }
      }
      /* Solo para lectores de pantalla: no se ve, pero se lee. */
      .solo-lector {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas
      id="juego"
      role="img"
      aria-label="Nenúfar. Se juega con las flechas o WASD, Enter para aceptar, Escape o I para abrir el inventario, Escape para volver, e I en combate para ver qué hace cada opción; también tocando la pantalla."
    ></canvas>
    <div id="anuncios" class="solo-lector" aria-live="polite"></div>
    <div id="girar"><span aria-hidden="true">⟳</span>Gira el móvil para jugar</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
